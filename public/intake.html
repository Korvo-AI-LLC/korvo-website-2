<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build your agent — Korvo AI</title>
  <meta name="description" content="The Korvo discovery intake: everything we need to build your after-hours AI receptionist. About 10 minutes." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#132F1E" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/intake.css" />
  <style>
    :root { --pine:#1A4A2E; --pine-deep:#132F1E; --ember:#E08A63; --kiln:#9A4A2C; --cream:#F0EBE2; --paper:#FAF6ED; --ink:#1E1E1E; --ink-mid:#4A4542; --on-dark:#F0EBE2; --on-dark-mid:rgba(240,235,226,.76);
            --serif:'Playfair Display', Georgia, serif; --sans:'Lato', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--cream); color: var(--ink); font: 400 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
    :focus-visible { outline: 3px solid var(--pine); outline-offset: 3px; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 0 clamp(16px, 4.5vw, 40px); }
    .nav { height: 64px; background: var(--pine-deep); }
    .nav .wrap { max-width: 1140px; height: 100%; display: flex; align-items: center; }
    .nav :focus-visible { outline-color: var(--ember); }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--on-dark); text-decoration: none; font: 700 22px/1 var(--serif); }
    .brand em { font-style: italic; font-weight: 400; color: var(--ember); }
    .brand svg { width: 30px; height: 30px; }
    header.page { background: var(--pine-deep); color: var(--on-dark); padding: 40px 0 48px; }
    header.page h1 { margin: 0; font: 700 clamp(34px, 5vw, 52px)/1.05 var(--serif); letter-spacing: -0.02em; }
    header.page p { margin: 12px 0 0; color: var(--on-dark-mid); font-size: 18px; max-width: 34em; }
    main { padding: 32px 0 72px; }
    .panel { background: var(--paper); border-radius: 6px; padding: clamp(20px, 3.4vw, 40px); box-shadow: 0 20px 60px -30px rgba(0,0,0,.35); --ki-nav-bg: var(--paper); }
    .foot { background: var(--pine-deep); color: var(--on-dark-mid); padding: 28px 0; font-size: 14px; }
    .foot .wrap { max-width: 1140px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }
    .foot a { color: var(--on-dark-mid); }
  </style>
</head>
<body>

<div class="nav">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Korvo AI home">
      <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,8 50,50 10,50" fill="#5E8B6F"/><polygon points="50,8 90,50 50,50" fill="#F0EBE2"/><polygon points="10,50 50,50 50,92" fill="#F0EBE2"/><polygon points="50,50 90,50 50,92" fill="#B85C3A"/><line x1="50" y1="8" x2="50" y2="92" stroke="#132F1E" stroke-width="5"/><line x1="10" y1="50" x2="90" y2="50" stroke="#132F1E" stroke-width="5"/></svg>
      <span>Korvo<em> AI</em></span>
    </a>
  </div>
</div>

<header class="page">
  <div class="wrap">
    <h1>Let's build your agent.</h1>
    <p>This takes about 10 minutes, and it's how we make it actually good. Your answers save on this device as you go.</p>
  </div>
</header>

<main class="wrap">
  <div class="panel" id="intakeMount"><p>Loading the intake…</p></div>
</main>

<footer class="foot">
  <div class="wrap">
    <span>&copy; 2026 Korvo AI LLC, Provo, Utah</span>
    <span><a href="/privacy">Privacy Policy</a> &nbsp; <a href="/terms">Terms</a> &nbsp; <a href="mailto:hello@korvo.ai">hello@korvo.ai</a></span>
  </div>
</footer>

<script src="/js/config.js"></script>
<script src="/js/intake-schema.js"></script>
<script src="/js/intake.js"></script>
<script>
(function () {
  'use strict';
  var mountEl = document.getElementById('intakeMount');
  if (!window.KorvoIntake || !window.KORVO_INTAKE) {
    mountEl.innerHTML = '<p>The intake form didn’t load. Refresh the page, or email hello@korvo.ai.</p>';
    return;
  }
  var MODE = (typeof INTAKE_AFTER === 'string' && INTAKE_AFTER === 'payment') ? 'payment' : 'signup';
  var state = null;
  try { state = JSON.parse(sessionStorage.getItem('korvoSignup') || 'null'); } catch (_) {}
  var paid = /[?&]paid=1(&|$)/.test(location.search);
  if (paid && state) { state.paid = true; try { sessionStorage.setItem('korvoSignup', JSON.stringify(state)); } catch (_) {} }
  // Signed up in this browser → prefill from it. Otherwise the first section also asks for phone + email.
  window.KorvoIntake.mount(mountEl, {
    signup: state,
    showPay: MODE === 'signup' && !!state && !state.paid,
    onDone: function () { if (state) { state.intakeDone = true; try { sessionStorage.setItem('korvoSignup', JSON.stringify(state)); } catch (_) {} } }
  });
})();
</script>
</body>
</html>
